# Delivery template for .github/workflows/copilot-repo-wide-live.yml after the preparation PR.
# Live dispatch requires a frozen adapter, fresh owner admission and an unused remote guard.
name: Copilot repo-wide hosted pilot
'on':
  workflow_dispatch:
    inputs:
      authentication_probe:
        description: Sessionless pinned CLI authentication only
        type: boolean
        default: false
      execute_live:
        description: One authorized prompt-based review; never retry this run
        type: boolean
        default: false
      review_case:
        description: One case only (one durable guard per PUB)
        type: choice
        options: [PUB-01, PUB-02, PUB-03, PUB-04, PUB-05, PUB-06, PUB-07, PUB-08, PUB-09, PUB-10]
        default: PUB-01
      preflight_nonce:
        description: Exact nonce of the fresh private admission receipt
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: copilot-repo-wide-readonly
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact SDK for constructor-only regression tests (never start CLI)
        working-directory: tools/copilot-pilot/repo_wide_readonly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic infrastructure tests
        env:
          PYTHONPATH: tools/copilot-pilot
        run: |
          python3 -m unittest discover -s tools/copilot-pilot/repo_wide_readonly/tests -v
          node --test tools/copilot-pilot/repo_wide_readonly/tests/*.test.mjs
      - name: Native CLI to local mock and isolated broker (no network, no credentials)
        env:
          PYTHONPATH: tools/copilot-pilot
        run: python3 -m repo_wide_readonly.hosted_offline --output "$RUNNER_TEMP/repo-wide-native"
      - name: Require pre-dispatch catalog proof from the shared production session path
        env:
          PYTHONPATH: tools/copilot-pilot
        run: python3 -m repo_wide_readonly.live_control check-offline --proof "$RUNNER_TEMP/repo-wide-native/native-proof.json"
      - name: Encrypt credential-free native diagnostic on failure
        id: startup-diagnostic
        if: ${{ failure() }}
        env:
          COPILOT_REPO_WIDE_PUBLIC_RECIPIENT: ${{ secrets.COPILOT_REPO_WIDE_PUBLIC_RECIPIENT }}
        run: |
          if [[ -f "$RUNNER_TEMP/repo-wide-native/private-native.json" ]]; then
            python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repo-wide-native'
          identity = {'purpose': 'offline-native-diagnostic-v2', 'run_id': os.environ['GITHUB_RUN_ID'],
                      'commit': os.environ['GITHUB_SHA'],
                      'plaintext_sha256': hashlib.sha256((root / 'private-native.json').read_bytes()).hexdigest()}
          (root / 'native-identity.json').write_text(json.dumps(identity))
          PY
            node tools/copilot-pilot/repo_wide_readonly/seal-file.mjs \
              "$RUNNER_TEMP/repo-wide-native/private-native.json" \
              "$RUNNER_TEMP/repo-wide-native/native-envelope.json" \
              "$RUNNER_TEMP/repo-wide-native/native-identity.json"
            echo 'sealed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload only recipient-encrypted native diagnostic
        if: ${{ failure() && steps.startup-diagnostic.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-wide-native-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/repo-wide-native/native-envelope.json
            ${{ runner.temp }}/repo-wide-native/native-identity.json
            ${{ runner.temp }}/repo-wide-native/receipt.json
      - name: Reconstruct all ten complete historical trees and diffs (never execute)
        env:
          PYTHONPATH: tools/copilot-pilot
        run: python3 -m repo_wide_readonly.prepare --output "$RUNNER_TEMP/repo-wide-historical"
      - name: Prepare private recovery fixture
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, secrets
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repo-wide-native'
          content = json.dumps({'purpose': 'encrypted hosted artifact recovery fixture, not review',
                                'nonce': secrets.token_hex(32)}, sort_keys=True).encode()
          (root / 'recovery-fixture.json').write_bytes(content)
          identity = {'purpose': 'offline-recovery-v1', 'run_id': os.environ['GITHUB_RUN_ID'],
                      'commit': os.environ['GITHUB_SHA'], 'plaintext_sha256': hashlib.sha256(content).hexdigest()}
          (root / 'recovery-identity.json').write_text(json.dumps(identity))
          PY
      - name: Encrypt before upload (public recipient only)
        env:
          COPILOT_REPO_WIDE_PUBLIC_RECIPIENT: ${{ secrets.COPILOT_REPO_WIDE_PUBLIC_RECIPIENT }}
        run: >-
          node tools/copilot-pilot/repo_wide_readonly/seal-file.mjs
          "$RUNNER_TEMP/repo-wide-native/recovery-fixture.json"
          "$RUNNER_TEMP/repo-wide-native/recovery-envelope.json"
          "$RUNNER_TEMP/repo-wide-native/recovery-identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-wide-offline-recovery-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/repo-wide-native/recovery-envelope.json
            ${{ runner.temp }}/repo-wide-native/recovery-identity.json
            ${{ runner.temp }}/repo-wide-native/receipt.json
            ${{ runner.temp }}/repo-wide-native/native-proof.json
            ${{ runner.temp }}/repo-wide-historical/summary.json
  sessionless-auth:
    if: ${{ inputs.authentication_probe || inputs.execute_live }}
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact SDK and bundled CLI from integrity lock
        working-directory: tools/copilot-pilot/repo_wide_readonly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authentication only, never a review
        working-directory: tools/copilot-pilot/repo_wide_readonly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node auth-preflight.mjs
  ledger-fixture:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Atomic remote exclusion in offline fixture namespace (no PUB guard)
        env:
          PYTHONPATH: tools/copilot-pilot
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m repo_wide_readonly.ledger_fixture
  reserve:
    if: ${{ inputs.execute_live }}
    needs: [offline, sessionless-auth]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen owner admission and atomically reserve this case once
        env:
          PYTHONPATH: tools/copilot-pilot
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_REPO_WIDE_ADMISSION: ${{ secrets.COPILOT_REPO_WIDE_ADMISSION }}
          PREFLIGHT_NONCE: ${{ inputs.preflight_nonce }}
          REVIEW_CASE: ${{ inputs.review_case }}
        run: python3 -m repo_wide_readonly.live_control reserve
  review:
    if: ${{ inputs.execute_live }}
    needs: reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exactly one isolated review handoff; no application or session retries
        env:
          PYTHONPATH: tools/copilot-pilot
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_REPO_WIDE_ADMISSION: ${{ secrets.COPILOT_REPO_WIDE_ADMISSION }}
          COPILOT_REPO_WIDE_PROMPT: ${{ secrets.COPILOT_REPO_WIDE_PROMPT }}
          COPILOT_REPO_WIDE_PUBLIC_RECIPIENT: ${{ secrets.COPILOT_REPO_WIDE_PUBLIC_RECIPIENT }}
          PREFLIGHT_NONCE: ${{ inputs.preflight_nonce }}
          REVIEW_CASE: ${{ inputs.review_case }}
        run: python3 -m repo_wide_readonly.live_host --execute --output "$RUNNER_TEMP/repo-wide-live"
      - name: Preserve only recipient-encrypted private output and safe receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-wide-encrypted-${{ inputs.review_case }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/repo-wide-live/encrypted-review.json
            ${{ runner.temp }}/repo-wide-live/identity.json
            ${{ runner.temp }}/repo-wide-live/receipt.json
