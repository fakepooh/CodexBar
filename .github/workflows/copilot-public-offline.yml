name: Copilot public historical pilot v2.1 (offline only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: copilot-public-pilot
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate offline-only package
        run: PYTHONPATH=tools/copilot-pilot python3 -m unittest discover -s tools/copilot-pilot/tests -v
      - name: Fetch inert historical objects only
        run: python3 tools/copilot-pilot/public_actions_repos.py --output "$RUNNER_TEMP/pub-objects"
      - name: Verify frozen inputs and build prompts without AI
        run: python3 tools/copilot-pilot/public_series.py --repos "$RUNNER_TEMP/pub-objects/repos.json" --output "$RUNNER_TEMP/pub-expanded-v21" --methodology prompt-review-v2.1.0 --contract tools/copilot-pilot/series/public-2026-10-22/expanded-v2.1.0/contract.json
      - name: Publish status only (never source, prompts, or evaluator material)
        env:
          REPORT: ${{ runner.temp }}/pub-expanded-v21/dry-run.json
        run: python3 tools/copilot-pilot/public_report.py
  future-live-disabled:
    if: ${{ false }}
    needs: offline
    environment: copilot-pilot-explicit-approval
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo 'Live execution is intentionally unimplemented and disabled.'
